services:
  # PostgreSQL Datenbank (DEVELOPMENT)
  # ⚠️ SECURITY WARNING: Port 5432 is exposed for development convenience
  # For production deployment, use: docker-compose -f docker-compose.prod.yml up
  postgres:
    image: postgres:15-alpine
    container_name: absenzflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absenzflow}
      POSTGRES_USER: ${POSTGRES_USER:-absenzflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # ⚠️ DEVELOPMENT ONLY - localhost-bound for safety
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absenzflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absenzflow-network

  # FastAPI Backend (DEVELOPMENT)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absenzflow-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-absenzflow}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-absenzflow}

      # LDAP Configuration
      LDAP_SERVER: ${LDAP_SERVER}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}

      # WebUntis API
      WEBUNTIS_USERNAME: ${WEBUNTIS_USERNAME}
      WEBUNTIS_PASSWORD: ${WEBUNTIS_PASSWORD}
      WEBUNTIS_SERVER: ${WEBUNTIS_SERVER:-neilo.webuntis.com}

      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-absenzflow@schule.de}

      # Application Settings (DEVELOPMENT DEFAULTS)
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      DEBUG: ${DEBUG:-true}  # Development default: true
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

      # WordPress Proxy Authentication
      WORDPRESS_PROXY_SECRET: ${WORDPRESS_PROXY_SECRET:-change-this-shared-secret-in-production}

      # Absence Auto-Deletion
      ABSENCE_RETENTION_DAYS: ${ABSENCE_RETENTION_DAYS:-90}
      ABSENCE_AUTO_DELETE_ENABLED: ${ABSENCE_AUTO_DELETE_ENABLED:-true}

      # Minimum advance notice for absence reports (calendar days, 0 = off)
      ABSENCE_MIN_ADVANCE_DAYS: ${ABSENCE_MIN_ADVANCE_DAYS:-0}

      # File Upload
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - ./backend:/app  # Full source mount for hot-reload
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - absenzflow-network
      - absenzflow-shared  # Für WordPress-Zugriff
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # Hot-reload enabled

  # Optional: pgAdmin für Datenbank-Management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: absenzflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@absenzflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres
    networks:
      - absenzflow-network
    profiles:
      - dev

volumes:
  postgres_data:

networks:
  absenzflow-network:
    driver: bridge
  absenzflow-shared:
    external: true  # Externes Netzwerk für WordPress-Integration
