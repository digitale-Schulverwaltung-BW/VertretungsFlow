[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
check_untyped_defs = True
disallow_untyped_decorators = False

# Relax strictness for common SQLAlchemy ORM issues and third-party integrations
# This allows Column[T] assignments and function arguments without inline type: ignore comments
# Also allows Any return types in integration code (WebUntis, LDAP, etc.)
disable_error_code = assignment,arg-type,no-any-return,attr-defined,index,dict-item,return-value

# Ignore missing stubs for third-party libraries
[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-passlib.*]
ignore_missing_imports = True

[mypy-python_ldap.*]
ignore_missing_imports = True

[mypy-ldap3.*]
ignore_missing_imports = True

[mypy-pypdf.*]
ignore_missing_imports = True

[mypy-reportlab.*]
ignore_missing_imports = True

[mypy-bleach.*]
ignore_missing_imports = True

[mypy-slowapi.*]
ignore_missing_imports = True

[mypy-ldap.*]
ignore_missing_imports = True

[mypy-app.api.endpoints.*]
ignore_missing_imports = True
