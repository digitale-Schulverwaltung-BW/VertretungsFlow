services:
  # PostgreSQL Datenbank (PRODUCTION - No Port Exposure)
  postgres:
    image: postgres:15-alpine
    container_name: absenzflow-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-absenzflow}
      POSTGRES_USER: ${POSTGRES_USER:-absenzflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # Must be set in .env - no default!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ⚠️ NO PORTS EXPOSED - Database only accessible from Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-absenzflow}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - absenzflow-network
    restart: unless-stopped

  # FastAPI Backend (PRODUCTION)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: absenzflow-backend
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-absenzflow}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-absenzflow}

      # LDAP Configuration
      LDAP_SERVER: ${LDAP_SERVER}
      LDAP_PORT: ${LDAP_PORT:-389}
      LDAP_BASE_DN: ${LDAP_BASE_DN}
      LDAP_BIND_DN: ${LDAP_BIND_DN}
      LDAP_BIND_PASSWORD: ${LDAP_BIND_PASSWORD}

      # WebUntis API
      WEBUNTIS_USERNAME: ${WEBUNTIS_USERNAME}
      WEBUNTIS_PASSWORD: ${WEBUNTIS_PASSWORD}
      WEBUNTIS_SERVER: ${WEBUNTIS_SERVER:-neilo.webuntis.com}

      # SMTP Configuration
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-absenzflow@schule.de}

      # Application Settings (PRODUCTION DEFAULTS)
      SECRET_KEY: ${SECRET_KEY}  # Must be set in .env - no default!
      CORS_ORIGINS: ${CORS_ORIGINS}  # Must be set to production domains only (NO localhost!)
      DEBUG: ${DEBUG:-false}  # Default: false (production)
      FRONTEND_URL: ${FRONTEND_URL}
      ENVIRONMENT: production  # Triggers production checks including CORS validation

      # WordPress Proxy Authentication
      WORDPRESS_PROXY_SECRET: ${WORDPRESS_PROXY_SECRET}  # Must be set in .env - no default!

      # Absence Auto-Deletion
      ABSENCE_RETENTION_DAYS: ${ABSENCE_RETENTION_DAYS:-90}
      ABSENCE_AUTO_DELETE_ENABLED: ${ABSENCE_AUTO_DELETE_ENABLED:-true}

      # Minimum advance notice for absence reports (calendar days, 0 = off)
      ABSENCE_MIN_ADVANCE_DAYS: ${ABSENCE_MIN_ADVANCE_DAYS:-0}

      # File Upload
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    volumes:
      - ./backend/uploads:/app/uploads  # Only uploads, not full backend source
      # ⚠️ NO SOURCE CODE MOUNT - Production uses built image
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - absenzflow-network
      - absenzflow-shared  # Für WordPress-Zugriff
    restart: unless-stopped
    # Production command (no --reload)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --workers 4

  # pgAdmin (DISABLED in production - use docker exec for DB access)
  # To enable for emergency DB access: docker-compose -f docker-compose.prod.yml --profile admin up
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: absenzflow-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@absenzflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}  # Must be set if using pgAdmin
    ports:
      - "127.0.0.1:5050:80"  # Only accessible from localhost
    depends_on:
      - postgres
    networks:
      - absenzflow-network
    profiles:
      - admin  # Only starts with --profile admin
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  absenzflow-network:
    driver: bridge
  absenzflow-shared:
    external: true  # Externes Netzwerk für WordPress-Integration
