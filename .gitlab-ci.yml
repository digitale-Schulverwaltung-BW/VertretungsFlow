stages:
  - test
  - build
  - quality
  - deploy

variables:
  POSTGRES_DB: absenzflow_test
  POSTGRES_USER: absenzflow
  POSTGRES_PASSWORD: password

test_backend:
  image: python:3.11
  services:
    - postgres:15
  stage: test
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
    - cd ..
  script:
    - cd backend
    # Set PYTHONPATH so pytest can find the 'app' module
    - export PYTHONPATH=.:$PYTHONPATH
    # Run all unit tests with coverage
    # See UNITTESTS.md for detailed test documentation
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=term
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage.xml
    expire_in: 1 week

test_frontend:
  image: node:18
  stage: test
  script:
    - cd wordpress-plugin
    - npm install --legacy-peer-deps
    - npm run test -- --run

build_frontend:
  image: node:18
  stage: build
  script:
    - cd wordpress-plugin
    - npm install --legacy-peer-deps
    - npm run build
  artifacts:
    paths:
      - wordpress-plugin/build/

lint_backend:
  image: python:3.11
  services:
    - postgres:15
  stage: quality
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
    - cd ..
  script:
    - cd backend
    - black . --check
    - flake8 .
    - mypy .
  
lint_frontend:
  image: node:18
  stage: quality
  script:
    - cd wordpress-plugin
    - npm install --legacy-peer-deps
    - npm run lint

quality_gate:
  image: alpine:latest
  stage: quality
  script:
    - echo "Quality gate passed"
  dependencies:
    - test_backend
    - test_frontend
    - lint_frontend
  only:
    - merge_requests

deploy:
  image: alpine:latest
  stage: deploy
  script:
    - echo "Deploy to staging environment"
  only:
    - main