stages:
  - test
  - build
  - quality
  - deploy

variables:
  POSTGRES_DB: absenzflow_test
  POSTGRES_USER: absenzflow
  POSTGRES_PASSWORD: password

test_backend:
  image: python:3.11
  services:
    - postgres:15
  stage: test
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
    - cd ..
  script:
    - cd backend
    - pytest tests/ -v --cov=app --cov-report=xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+)%/'

test_frontend:
  image: node:18
  stage: test
  script:
    - cd wordpress-plugin
    - npm install
    - npm run test

build_frontend:
  image: node:18
  stage: build
  script:
    - cd wordpress-plugin
    - npm install
    - npm run build
  artifacts:
    paths:
      - wordpress-plugin/build/

lint_backend:
  image: python:3.11
  services:
    - postgres:15
  stage: quality
  before_script:
    - cd backend
    - pip install -r requirements-dev.txt
    - cd ..
  script:
    - cd backend
    - black . --check
    - flake8 .
    - mypy .
  
lint_frontend:
  image: node:18
  stage: quality
  script:
    - cd wordpress-plugin
    - npm install
    - npm run lint

quality_gate:
  image: alpine:latest
  stage: quality
  script:
    - echo "Quality gate passed"
  dependencies:
    - test_backend
    - test_frontend
    - lint_frontend
  only:
    - merge_requests

deploy:
  image: alpine:latest
  stage: deploy
  script:
    - echo "Deploy to staging environment"
  only:
    - main